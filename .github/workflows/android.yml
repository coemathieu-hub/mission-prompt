# Compile l'APK Android (debug toujours, release signé si les secrets sont configurés).
# Sur un tag v1.2.3 : publie aussi une « Release » GitHub avec l'APK et le HTML autonome.
name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Ubuntu 24.04 : le SDK Android y est préinstallé (ANDROID_HOME), licences acceptées.
    runs-on: ubuntu-24.04
    env:
      MP_KEYSTORE_BASE64: ${{ secrets.MP_KEYSTORE_BASE64 }}
      MP_KEYSTORE_PASSWORD: ${{ secrets.MP_KEYSTORE_PASSWORD }}
      MP_KEY_ALIAS: ${{ secrets.MP_KEY_ALIAS }}
      MP_KEY_PASSWORD: ${{ secrets.MP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: SDK Android disponible
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - run: npm ci
      - run: npm test
      - run: npm run build:app
      - run: npm run build:single

      - name: APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk mission-prompt-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mission-prompt-debug-apk
          path: mission-prompt-debug.apk

      - name: APK release signé
        if: ${{ env.MP_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$MP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export MP_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          (cd android && ./gradlew assembleRelease --no-daemon)
          cp android/app/build/outputs/apk/release/app-release.apk mission-prompt.apk
      - uses: actions/upload-artifact@v4
        if: ${{ env.MP_KEYSTORE_BASE64 != '' }}
        with:
          name: mission-prompt-release-apk
          path: mission-prompt.apk

      - name: Release GitHub (sur tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mission-prompt-debug.apk
            mission-prompt.apk
            dist/single/mission-prompt.html
          fail_on_unmatched_files: false
